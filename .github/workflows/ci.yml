name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      # One suite renders the real engine in the Chrome the runner already has.
      # Without a browser it skips itself and says so.
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
