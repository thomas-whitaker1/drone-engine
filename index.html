<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drone Engine</title>
    <meta
      name="description"
      content="A drone-metal generator drawn as a scavenged, half-broken control board. Turn the knobs; an endless slab of doom builds itself. It starts loud, and it flashes."
    />
    <meta name="theme-color" content="#121009" />
    <!-- What a link to the board shows where it is shared (gt#121). A card
         needs absolute addresses, so these name where the board is hosted;
         nothing here is fetched by the page. The image is public/card.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Drone Engine" />
    <meta
      property="og:description"
      content="A drone-metal generator drawn as a scavenged, half-broken control board. Turn the knobs; an endless slab of doom builds itself. It starts loud, and it flashes."
    />
    <meta property="og:url" content="https://thomasw.cool/play/drone-engine/" />
    <meta property="og:image" content="https://thomasw.cool/play/drone-engine/card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The board: eleven noise modules in scored metal wells above a row of seven boxes, with cables patched between them." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The tab's icon, carried in the page: one knob and one lamp. A browser
         that finds no icon here asks the server for /favicon.ico, and this
         page asks the network for nothing. The address in the SVG's namespace
         is spelled with %2F so the shell still contains no URL to fetch. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23121009'/%3E%3Ccircle cx='15' cy='18' r='10.5' fill='%232b2318'/%3E%3Ccircle cx='15' cy='18' r='8.5' fill='%237d7259'/%3E%3Crect x='13.5' y='9' width='3' height='8.5' rx='1.2' fill='%23d5cbb0'/%3E%3Ccircle cx='26.5' cy='5.5' r='2.6' fill='%23ffb352'/%3E%3C/svg%3E"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #121009;
        overflow-x: hidden;
      }

      /* The film grain's jitter. Declared here because a @keyframes rule cannot
         be written as an inline style, and the whole board is built in code —
         src/tokens names it, src/ui/atmosphere animates with it. */
      @keyframes grainShift{0%{transform:translate(0,0)}20%{transform:translate(-28px,14px)}40%{transform:translate(16px,-22px)}60%{transform:translate(-10px,-8px)}80%{transform:translate(22px,18px)}100%{transform:translate(0,0)}}

      /* The advanced-effects shelf's two keyframed layers (gt#39), here for the
         same reason the grain's are, and named in src/tokens the same way.
         Neither is ever mounted visible unless COME APART has been armed — the
         layer that owns them is src/ui/rupture, and the gate is in ../apart.

         `signalRoll` carries the band a full window past both edges, so the
         tear enters and leaves rather than appearing mid-screen.

         `strobeFlash` is lit for the first tenth of its period and dark for the
         rest, which is what makes it a flash rather than a pulse. Its *rate* is
         not here: the period comes from RUPTURE.strobe.periodMs, and the 3Hz
         cap on it is asserted arithmetically in tests/rupture.test.ts rather
         than written into this file where nothing could check it. */
      @keyframes signalRoll{0%{translate:0 -100vh}100%{translate:0 100vh}}
      @keyframes strobeFlash{0%{opacity:var(--strobePeak,0.4)}10.9%{opacity:var(--strobePeak,0.4)}11%{opacity:0}100%{opacity:0}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
